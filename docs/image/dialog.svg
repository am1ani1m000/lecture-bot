idth="1.4" stroke-linejoin="round"/></g><text x="77" y="405" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9a9aa3" text-anchor="start">recursion.pdf · стр. 2</text><rect x="524.16849609375" y="444" width="327.83150390625" height="44" rx="18" fill="#ffffff"/><text x="542.16849609375" y="472" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f0f11" text-anchor="start">Кто придумал сортировку слиянием?</text><rect x="28" y="502" width="279.2366015625" height="44" rx="18" fill="#202024" stroke="#2d2d33" stroke-width="1"/><text x="46" y="530" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start">В материалах ответа не нашёл.</text></svg>